<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
  <title>PsicoFlow — proposta visual para a visão integrada por paciente</title>
  <desc>Simulação não interativa usando dados sintéticos e as cores sugeridas.</desc>
  <defs>
	<style>
	  text { font-family: 'Segoe UI', Arial, sans-serif; fill: #2A3C5B; }
	  .small { font-size: 13px; fill: #657187; }
	  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.7px; fill: #276851; }
	  .heading { font-size: 32px; font-weight: 700; letter-spacing: -.5px; }
	  .nav { font-size: 15px; fill: #DDE6EE; }
	  .nav-current { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
	  .title { font-size: 18px; font-weight: 700; }
	  .label { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #52657D; }
	  .rule { stroke: #E5EAE7; stroke-width: 1; }
	  .button { font-size: 14px; fill: #FFFFFF; font-weight: 700; }
	  .link { font-size: 13px; font-weight: 600; fill: #2A3C5B; }
	</style>
	<filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#2A3C5B" flood-opacity=".05"/></filter>
  </defs>
  <rect width="1440" height="1040" fill="#F6F7F4"/>
  <rect x="0" y="0" width="256" height="1040" fill="#2A3C5B"/>
  <rect x="28" y="30" width="40" height="40" rx="13" fill="#4FB286"/>
  <path d="M38 52c7-1 8-11 20-12-2 10-7 17-17 16M43 54l9-8" fill="none" stroke="#2A3C5B" stroke-width="2.3" stroke-linecap="round"/>
  <text x="80" y="56" font-size="22" font-weight="700" style="fill:#fff">psicoflow</text>
  <text x="30" y="126" font-size="10" font-weight="700" letter-spacing="1.7" style="fill:#BECADB">WORKSPACE</text>
  <rect x="16" y="145" width="224" height="52" rx="12" fill="#FFFFFF" fill-opacity=".13"/>
  <rect x="16" y="157" width="4" height="28" rx="2" fill="#4FB286"/>
  <circle cx="46" cy="170" r="9" fill="none" stroke="#A8E3C8" stroke-width="1.7"/><path d="M40 172h12M46 166v12" stroke="#A8E3C8" stroke-width="1.6"/>
  <text x="70" y="175" class="nav-current">Pacientes</text>
  <rect x="37" y="220" width="18" height="17" rx="3" fill="none" stroke="#CBD7E1" stroke-width="1.5"/><path d="M37 226h18M42 216v6M50 216v6" stroke="#CBD7E1" stroke-width="1.5"/>
  <text x="70" y="234" class="nav">Agenda</text>
  <line x1="28" y1="932" x2="228" y2="932" stroke="#FFFFFF" stroke-opacity=".2"/>
  <circle cx="48" cy="975" r="20" fill="#A78682"/><text x="48" y="980" text-anchor="middle" font-size="15" font-weight="700" style="fill:#fff">D</text>
  <text x="80" y="970" font-size="13" font-weight="700" style="fill:#fff">Dra. Demo</text><text x="80" y="991" font-size="12" style="fill:#C1CDDA">Workspace individual</text>
  <rect x="256" y="0" width="1184" height="76" fill="#FFFFFF"/>
  <line x1="256" y1="76" x2="1440" y2="76" stroke="#E3E9E4"/>
  <text x="314" y="46" class="small">Workspace <tspan fill="#A78682"> / </tspan> Pacientes <tspan fill="#A78682"> / </tspan> <tspan fill="#2A3C5B" font-weight="600">Ana Costa</tspan></text>
  <circle cx="1268" cy="39" r="4" fill="#3C896D"/><text x="1280" y="44" class="small">Acesso privado</text>
  <text x="320" y="124" class="link">←  Voltar aos pacientes</text>
  <text x="320" y="167" class="eyebrow">VISÃO INTEGRADA DO PACIENTE</text>
  <text x="320" y="211" class="heading">Ana Costa</text>
  <text x="320" y="239" class="small">ana.exemplo@demo.local  ·  Paciente ativo</text>
  <rect x="986" y="181" width="178" height="48" rx="10" fill="#FFFFFF" stroke="#BCCBC3"/><text x="1011" y="210" font-size="14" font-weight="700">＋  Nova pendência</text>
  <rect x="1178" y="181" width="186" height="48" rx="10" fill="#2A3C5B"/><text x="1202" y="210" class="button">＋  Registrar sessão</text>
  <text x="320" y="291" class="title">Visão geral</text><text x="320" y="314" class="small">O contexto necessário para acompanhar seu atendimento.</text>
  <rect x="320" y="335" width="335" height="177" rx="16" fill="#FFFFFF" stroke="#E4EAE6" filter="url(#shadow)"/>
  <rect x="339" y="354" width="36" height="36" rx="11" fill="#E1F3EA"/><text x="357" y="378" text-anchor="middle" font-size="18" fill="#276851">✦</text>
  <text x="390" y="377" class="label">ÚLTIMA SESSÃO</text><text x="340" y="424" font-size="18" font-weight="700">16 de novembro de 2026</text><text x="340" y="450" class="small">Registro mais recente</text><text x="340" y="485" class="link">Abrir registro  →</text>
  <rect x="669" y="335" width="335" height="177" rx="16" fill="#FFFFFF" stroke="#E4EAE6" filter="url(#shadow)"/>
  <rect x="688" y="354" width="36" height="36" rx="11" fill="#E8EDF4"/><text x="706" y="378" text-anchor="middle" font-size="18">□</text>
  <text x="739" y="377" class="label">PRÓXIMO COMPROMISSO</text><text x="689" y="424" font-size="18" font-weight="700">23 de novembro · 14h</text><text x="689" y="450" class="small">Até 14h50 · horário local</text><text x="689" y="485" class="small">Agendado na Agenda</text>
  <rect x="1018" y="335" width="346" height="177" rx="16" fill="#F1E9E7"/>
  <rect x="1037" y="354" width="36" height="36" rx="11" fill="#FFFFFF"/><text x="1055" y="378" text-anchor="middle" font-size="18">✓</text>
  <text x="1087" y="377" class="label">PENDÊNCIAS EM ABERTO</text><text x="1038" y="424" font-size="18" font-weight="700">1 pendência</text><text x="1038" y="450" class="small">Retomar tema de demonstração</text><text x="1038" y="485" class="link">Ver pendências  →</text>
  <rect x="320" y="536" width="1044" height="235" rx="16" fill="#FFFFFF" stroke="#E4EAE6" filter="url(#shadow)"/>
  <text x="347" y="577" class="title">Histórico de sessões</text><text x="347" y="600" class="small">Registros organizados do mais recente ao mais antigo.</text>
  <rect x="1181" y="558" width="155" height="38" rx="9" fill="#F6F7F4" stroke="#DAE4DD"/><text x="1201" y="582" font-size="12" font-weight="700">＋  Registrar sessão</text>
  <line x1="347" y1="621" x2="1337" y2="621" class="rule"/>
  <rect x="348" y="642" width="4" height="91" rx="2" fill="#4FB286"/>
  <text x="369" y="660" font-size="15" font-weight="700">16 de novembro de 2026</text><text x="369" y="682" class="small">Atualizado em 16 nov 2026, 15h30</text>
  <text x="369" y="716" font-size="14" fill="#52657D">Anotação sintética para demonstrar o histórico de sessões.</text>
  <text x="1151" y="660" class="link">Abrir / editar</text><text x="1257" y="660" class="link">Ver versões</text>
  <rect x="320" y="792" width="1044" height="164" rx="16" fill="#FFFFFF" stroke="#E4EAE6" filter="url(#shadow)"/>
  <text x="347" y="833" class="title">Pendências</text><text x="347" y="856" class="small">Acompanhe itens em aberto e concluídos.</text>
  <rect x="1181" y="814" width="155" height="38" rx="9" fill="#F6F7F4" stroke="#DAE4DD"/><text x="1204" y="838" font-size="12" font-weight="700">＋  Nova pendência</text>
  <line x1="347" y1="875" x2="1337" y2="875" class="rule"/>
  <circle cx="361" cy="913" r="10" fill="none" stroke="#3C896D" stroke-width="2"/>
  <text x="386" y="906" font-size="14" font-weight="700">Retomar tema de demonstração</text><text x="386" y="930" class="small">Em aberto · Prazo: 23 de novembro de 2026</text>
  <text x="1225" y="916" class="link">Concluir</text><text x="1300" y="916" class="link">Editar</text>
  <text x="320" y="991" class="small">◉  Dados sintéticos para demonstração · Não utilize dados reais nesta versão.</text>
  <text x="1364" y="1020" text-anchor="end" font-size="11" fill="#657187">SIMULAÇÃO VISUAL · NÃO INTERATIVA</text>
</svg>